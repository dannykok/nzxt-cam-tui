[workspace]
members = [
    "crates/core",
    "crates/protocol",
    "crates/hwd",
    "crates/tui",
]
default-members = ["crates/tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
nzxt-cam-core = { path = "crates/core", version = "0.1.0" }
nzxt-cam-protocol = { path = "crates/protocol", version = "0.1.0" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
listenfd = "1.0.2"
nvml-wrapper = "0.13"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "0.8"
